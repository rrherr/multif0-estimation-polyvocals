[project]
name = "multif0-estimation-polyvocals"
version = "0.3.0"
description = "Multiple F0 estimation in vocal ensembles (Cuesta, McFee & Gómez, ISMIR 2020): inference with the pretrained models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.11",
    "numba>=0.60",
    "numpy>=1.26",
    "safetensors>=0.4",
    "scipy>=1.14",
    "soundfile>=0.13",
    "torch>=2.4",
]

[dependency-groups]
dev = ["h5py>=3.12", "mypy>=1.10", "pytest>=8", "ruff>=0.6"]

[project.scripts]
multif0 = "multif0.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["multif0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["multif0"]

[[tool.mypy.overrides]]
module = ["librosa", "librosa.*", "scipy", "scipy.*", "numba", "soundfile", "h5py"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numerics ported from librosa 0.7 / resampy, whose numpy and scipy calls are typed as Any
module = ["multif0.features"]
warn_return_any = false
